; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-8048s070c]
platform = espressif32@6.9.0
board = esp32-8048s070c
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
lib_deps = 
	bodmer/TFT_eSPI
	lvgl/lvgl@9.5.0
	tamctec/TAMC_GT911@^1.0.2
	moononournation/GFX Library for Arduino@1.5.0
	bblanchon/ArduinoJson@^7.4.2
monitor_speed = 115200
; Decode Guru Meditation backtraces to file:line in the serial monitor
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags = 
	; 0 = no core logging. Level 5 (verbose) printed a line per HTTP/SSL/TLS step,
	; which costs flash, cycles and - importantly - stack inside the TLS call
	; chain that was already overflowing. Raise to 1 to keep errors only.
	-DCORE_DEBUG_LEVEL=0
	-Iinclude
	; Make the repo's include/lv_conf.h the authoritative LVGL config
	; (it holds the enlarged LV_MEM_SIZE pool).
	-DLV_CONF_INCLUDE_SIMPLE
	; The Arduino loopTask stack defaults to 8192 bytes. The panic log showed the
	; backtrace alone walking 7744 bytes of it ("Stack canary watchpoint
	; triggered (loopTask)") inside LVGL's layout/render, and the earlier TLS
	; handshake crash was the same overflow reached by a different path.
	; arduino-esp32's cores/esp32/main.cpp honours ARDUINO_LOOP_STACK_SIZE in
	; preference to sdkconfig, so this takes effect without touching the core.
	-DARDUINO_LOOP_STACK_SIZE=16384
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
